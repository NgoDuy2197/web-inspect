<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- network links -->
  <g stroke="#93c5fd" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="52" y1="56" x2="100" y2="104"/>
    <line x1="204" y1="56" x2="156" y2="104"/>
    <line x1="52" y1="200" x2="100" y2="152"/>
    <line x1="204" y1="200" x2="156" y2="152"/>
    <line x1="52" y1="56" x2="204" y2="56" stroke-dasharray="2 16"/>
    <line x1="52" y1="200" x2="204" y2="200" stroke-dasharray="2 16"/>
  </g>
  <!-- network nodes -->
  <g fill="#dbeafe" stroke="#1e3a8a" stroke-width="5">
    <circle cx="52" cy="56" r="17"/>
    <circle cx="204" cy="56" r="17"/>
    <circle cx="52" cy="200" r="17"/>
    <circle cx="204" cy="200" r="17"/>
  </g>
  <!-- watching eye -->
  <path d="M40 128 C 72 82, 184 82, 216 128 C 184 174, 72 174, 40 128 Z" fill="#ffffff" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="31" fill="url(#iris)" stroke="#0f172a" stroke-width="5"/>
  <circle cx="128" cy="128" r="14" fill="#0f172a"/>
  <circle cx="118" cy="117" r="7" fill="#ffffff"/>
